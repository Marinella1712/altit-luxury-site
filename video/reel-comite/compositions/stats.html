    (function () {
      const tl = gsap.timeline({ paused: true });
      const lineIn = (sel, t) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, t);
      const swapOut = (sel, t) =>
        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, t);
      const flood = (color, t) =>
        tl.to("#st-ground", { backgroundColor: color, duration: 0.3, ease: "power2.inOut" }, t);

      // 6+ lands out of the whip from the reveal.
      tl.fromTo("#st-g1", { opacity: 1, y: 520, filter: "blur(18px)" }, { y: 0, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 0);

      swapOut("#st-g1", 1.12);

      // 10+ on cream.
      flood("#F4EFE8", 1.05);
      tl.set("#st-g2", { opacity: 1 }, 1.2);
      tl.fromTo("#st-n2", { opacity: 0, scale: 1.12, transformOrigin: "100% 50%", filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 1.2);
      lineIn("#st-l2", 1.35);
      swapOut("#st-g2", 2.25);

      // 98% counts up on gold.
      flood("#C9A87C", 2.25);
      tl.set("#st-g3", { opacity: 1 }, 2.4);
      const n3 = document.querySelector("#st-n3");
      const counter = { v: 10 };
      tl.fromTo(counter, { v: 10 }, {
        v: 98, duration: 0.55, ease: "power3.out",
        onUpdate: () => { n3.textContent = Math.round(counter.v) + "%"; },
      }, 2.4);
      lineIn("#st-l3", 2.55);
      tl.to("#st-g3", { x: -420, filter: "blur(16px)", opacity: 0, duration: 0.2, ease: "power3.in" }, 3.45);

      // 24/7 whips in from the same direction on black.
      flood("#09090F", 3.45);
      tl.fromTo("#st-g4", { opacity: 0, x: 420, filter: "blur(16px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, 3.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["stats"] = tl;
