  <script>
    (function () {
      const STEP = 168; // slot height 150 + gap 18
      const N = 10; // slots in the column
      const colY = (latest) => (N - latest) * STEP;
      const tl = gsap.timeline({ paused: true });

      // Frame 0: punched in on the first message (the hook), the rest of the thread waiting below.
      gsap.set("#chat-col", { y: colY(1) });
      gsap.set("#chat-cam", { transformOrigin: "0 0", scale: 1.7, x: -777.5, y: -1322.5 });
      gsap.set(["#chat-m2", "#chat-m3", "#chat-m4", "#chat-m5", "#chat-m6", "#chat-m7", "#chat-m8", "#chat-m9", "#chat-gold", "#chat-typing"], { opacity: 0 });

      // Pull back to the whole group chat.
      tl.fromTo("#chat-cam", { scale: 1.7, x: -777.5, y: -1322.5 }, { scale: 1, x: 0, y: 0, duration: 0.8, ease: "power2.inOut" }, 1.6);

      // Messages pile up, faster and faster.
      const arrivals = [
        ["#chat-m2", 2.3, "top right"],
        ["#chat-m3", 2.85, "top left"],
        ["#chat-m4", 3.35, "top right"],
        ["#chat-m5", 3.8, "top right"],
        ["#chat-m6", 4.2, "top right"],
        ["#chat-m7", 4.5, "top right"],
        ["#chat-m8", 4.7, "top right"],
        ["#chat-m9", 4.85, "top right"],
      ];
      arrivals.forEach(([sel, t, origin], i) => {
        const k = i + 2;
        tl.fromTo("#chat-col", { y: colY(k - 1) }, { y: colY(k), duration: 0.22, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo(sel, { opacity: 0, scale: 0.75, transformOrigin: origin }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
      });

      // Altit is typing…
      tl.fromTo("#chat-col", { y: colY(9) }, { y: colY(10), duration: 0.22, ease: "power3.out", immediateRender: false }, 5.0);
      tl.fromTo("#chat-typing", { opacity: 0, scale: 0.75, transformOrigin: "top right" }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 5.0);
      ["#chat-d1", "#chat-d2", "#chat-d3"].forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: -10, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 5.1 + i * 0.08);
      });

      // …and answers.
      tl.to("#chat-typing", { opacity: 0, duration: 0.06 }, 5.6);
      tl.fromTo("#chat-gold", { opacity: 0, scale: 0.75, transformOrigin: "top right" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, 5.6);
      tl.fromTo("#chat-cam", { scale: 1, x: 0, y: 0 }, { scale: 1.35, x: -434.7, y: -753.75, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 5.75);

      // The gold bubble becomes the next world.
      tl.to("#chat-header", { opacity: 0, duration: 0.2 }, 7.15);
      tl.to("#chat-gold-txt, #chat-gold .who, #chat-gold .time", { opacity: 0, duration: 0.15 }, 7.2);
      tl.fromTo("#chat-gold", { scale: 1, transformOrigin: "50% 50%" }, { scale: 16, duration: 0.65, ease: "power2.in", immediateRender: false }, 7.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["chat"] = tl;
    })();
  </script>
