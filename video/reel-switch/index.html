<!doctype html>
<html
  lang="he"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-gold","type":"color","label":"Or","default":"#C9A87C"},
    {"id":"headline1","type":"string","label":"Titre ligne 1","default":"השקט"},
    {"id":"headline2","type":"string","label":"Titre ligne 2","default":"הופעל."},
    {"id":"sub1","type":"string","label":"Sous-titre 1","default":"ניהול ואחזקת מבנים — אילת"},
    {"id":"sub2","type":"string","label":"Sous-titre 2","default":"לבעלי דירות בבתים משותפים"},
    {"id":"phone","type":"string","label":"Téléphone","default":"054-792-3868"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root { --color-gold: #c9a87c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #e8ded0; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="wall" class="clip" data-composition-id="wall" data-composition-src="compositions/wall.html"
        data-start="0" data-duration="9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- Sound: the switch clicks, the room powers on, the camera moves. -->
      <audio id="sfx-click-on" src="assets/sfx/click.mp3" data-start="0.98" data-duration="0.36" data-track-index="3" data-volume="0.9"></audio>
      <audio id="sfx-power" src="assets/sfx/impact-bass-2.mp3" data-start="1.05" data-duration="2.0" data-track-index="4" data-volume="0.35" data-fade-out="0.6"></audio>
      <audio id="sfx-pull" src="assets/sfx/whoosh-short.mp3" data-start="1.45" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-click-off" src="assets/sfx/click-soft.mp3" data-start="7.28" data-duration="0.36" data-track-index="3" data-volume="0.85"></audio>
      <audio id="sfx-push" src="assets/sfx/whoosh-short.mp3" data-start="7.8" data-duration="0.57" data-track-index="5" data-volume="0.2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
