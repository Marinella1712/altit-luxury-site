  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T = 9.0;
      // Camera framing: scale s with the switch centre (540, 300) shown at screen (540, 760).
      const close = (s) => ({ scale: s, x: 540 - 540 * s, y: 760 - 300 * s });
      const wide = (s) => ({ scale: s, x: 540 - 540 * s, y: 1000 - 1000 * s });

      tl.set("#cam", close(1.7), 0);
      tl.to("#cam", { ...close(1.74), duration: 1.0, ease: "power1.inOut" }, 0);

      // ON: the click, the knob slides, the switch lights gold.
      const on = (t) => {
        tl.to("#sw-knob", { x: 224, duration: 0.18, ease: "power4.out" }, t);
        tl.to("#sw-track", { backgroundColor: "#121219", duration: 0.08, ease: "none" }, t);
        tl.to("#sw-knob-on", { opacity: 1, duration: 0.06, ease: "none" }, t + 0.04);
        tl.to("#sw-off", { opacity: 0, duration: 0.05, ease: "none" }, t);
        tl.to("#sw-on", { opacity: 1, duration: 0.06, ease: "none" }, t + 0.06);
        tl.to("#spill", { opacity: 1, duration: 0.12, ease: "power2.out" }, t + 0.04);
        tl.to(["#room-on", "#fixture-on", "#ceil-glow"], { opacity: 1, duration: 0.14, ease: "power2.out" }, t + 0.067);
        // The poster lights like a sign: on, a dip, on.
        tl.set("#poster", { opacity: 1 }, t + 0.067);
        tl.set("#poster", { opacity: 0.35 }, t + 0.1);
        tl.set("#poster", { opacity: 1 }, t + 0.133);
      };
      const off = (t) => {
        tl.to("#sw-knob", { x: 0, duration: 0.18, ease: "power4.out" }, t);
        tl.to("#sw-track", { backgroundColor: "#5b5b60", duration: 0.08, ease: "none" }, t);
        tl.to("#sw-knob-on", { opacity: 0, duration: 0.05, ease: "none" }, t);
        tl.to("#sw-on", { opacity: 0, duration: 0.05, ease: "none" }, t);
        tl.to("#sw-off", { opacity: 1, duration: 0.06, ease: "none" }, t + 0.06);
        tl.to(["#spill", "#room-on", "#fixture-on", "#ceil-glow"], { opacity: 0, duration: 0.08, ease: "none" }, t + 0.03);
        tl.set("#poster", { opacity: 0 }, t + 0.033);
      };

      on(1.0);
      tl.to("#cam", { ...wide(1.0), duration: 1.2, ease: "power3.inOut" }, 1.35);
      tl.to("#cam", { ...wide(1.04), duration: 4.75, ease: "none" }, 2.55);
      off(7.3);
      tl.to("#cam", { ...close(1.7), duration: 1.3, ease: "power2.inOut" }, 7.6);

      // Leaves sway on a 4.5 s cycle, so frame 0 and the last frame match.
      const sway = [
        ["#fr-a", 980, 420, 2.5],
        ["#fr-b", 1120, 900, -2.0],
        ["#fr-c", 1060, 1350, 3.0]
      ];
      sway.forEach(([id, ox, oy, deg], i) => {
        tl.set(id, { svgOrigin: ox + " " + oy, rotation: -deg }, 0);
        tl.to(id, { rotation: deg, duration: T / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["wall"] = tl;
    })();
  </script>
