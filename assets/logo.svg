<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" fill="none">
  <!-- Buildings icon -->
  <g transform="translate(5, 8)">
    <!-- Left building (gold gradient) -->
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#C9A87C;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#A07B4F;stop-opacity:1" />
      </linearGradient>
    </defs>
    <!-- Tall center building (black) -->
    <rect x="28" y="4" width="10" height="64" fill="#1A1A1A"/>
    <!-- Right building (black) -->
    <rect x="42" y="18" width="10" height="50" fill="#1A1A1A"/>
    <!-- Small right building -->
    <rect x="54" y="28" width="8" height="40" fill="#1A1A1A"/>
    <!-- Left building (gold) -->
    <rect x="10" y="28" width="9" height="40" fill="url(#goldGrad)"/>
    <!-- Far left small (gold) -->
    <rect x="0" y="40" width="7" height="28" fill="url(#goldGrad)"/>
    <!-- Peaks -->
    <polygon points="28,4 33,0 38,4" fill="#1A1A1A"/>
  </g>

  <!-- Vertical separator -->
  <line x1="82" y1="12" x2="82" y2="78" stroke="#CCCCCC" stroke-width="1.2"/>

  <!-- Text: ALTIT LUXURY -->
  <text x="94" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1A1A1A" letter-spacing="3">ALTIT</text>
  <text x="94" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1A1A1A" letter-spacing="3">LUXURY</text>
  <text x="94" y="82" font-family="Arial, sans-serif" font-size="9" fill="#888888" letter-spacing="2">BUILDING MANAGEMENT &amp; MAINTENANCE LTD</text>
</svg>
